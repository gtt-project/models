# Keeps the pinned Actions current, including the datamodels-toolkit Action:
# Dependabot bumps the commit SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait 8 days before proposing a new release, to reduce the risk from a
    # freshly published (possibly hijacked) version.
    cooldown:
      default-days: 8
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
