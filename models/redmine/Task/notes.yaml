# Notes: the sources, the decisions and their reasons, what is left out. Shown on the model's page.
notes:
  - en: "The same type as datamodels.jp's Task (https://datamodels.jp/ns/task/Task, v1.0.0), with one attribute that Redmine has and Task does not: category, the issue category that each Redmine project defines. A Task from GTT is a datamodels.jp Task, so applications that know Task need nothing more."
  - en: "The other Redmine fields map to Task as in datamodels.jp's Redmine mapping table (https://github.com/geolonia/datamodels/blob/main/models/task/Task/mapping/redmine.yaml): subject to name, status to progress and statusLabel, tracker to subtype, the priority's position to priority 1 to 9, target version to milestone, start date and due date to start and due."
  - en: "Left out: the priority's name (Redmine's \"Normal\", \"Urgent\"), which no application needs yet; trackers as subtypes and custom fields, which differ between Redmine instances and stay in each instance's own @context."
  - en: "Replaces GTT's Issue vocabulary (https://gtt-project.org/ns/fiware), retired on 2026-10-11 before it had users outside the project."
