# Notes: the sources, the decisions and their reasons, what is left out. Shown on the model's page.
notes:
  - en: "The same type as datamodels.jp's Task (https://datamodels.jp/ns/task/Task, v1.0.0) under Redmine's name: in this subject's @context the term Issue stands for Task's IRI. With this @context an entity reads \"type\": \"Issue\"; with datamodels.jp's, the same entity reads Task, and a query for Task finds it. The @context sets the term Task to null, so that a broker answering with this @context writes Issue, not Task (both terms would name the same IRI, and JSON-LD would pick the shorter one). One attribute is added that Redmine has and Task does not: category, the issue category that each Redmine project defines."
  - en: "The other Redmine fields map to Task as in datamodels.jp's Redmine mapping table (https://github.com/geolonia/datamodels/blob/main/models/task/Task/mapping/redmine.yaml): subject to name, status to progress and statusLabel, tracker to subtype, the priority's position to priority 1 to 9, target version to milestone, start date and due date to start and due."
  - en: "Left out: the priority's name (Redmine's \"Normal\", \"Urgent\"), which no application needs yet; trackers as subtypes and custom fields, which differ between Redmine instances and stay in each instance's own @context."
  - en: "Replaces GTT's Issue vocabulary (https://gtt-project.org/ns/fiware), retired on 2026-10-11 before it had users outside the project. Version 0.1.0 of this subject named the model Task; 0.2.0 names it Issue (2026-10-11)."
  - en: "Redmine's trackers are not a model here: each Redmine instance defines its own, so the plugin sends the tracker as subtype, and each instance's own @context declares its trackers as subtypes of the issue type."
